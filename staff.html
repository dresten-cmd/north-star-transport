<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Transport | Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Viga&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="flex items-center justify-between px-6 py-4">
        <a href="index.html" class="flex items-center">
            <img src="NST Logo New 2026.png" alt="North Star Transport Logo" class="h-10 md:h-12 w-auto object-contain">
        </a>
        <div class="hidden md:flex space-x-8 uppercase text-sm tracking-widest">
            <a href="index.html" class="hover:text-yellow-500 transition">Home</a>
            <a href="news.html" class="hover:text-yellow-500 transition">News</a>
            <a href="staff.html" class="text-yellow-500">Staff</a>
            <a href="partners.html" class="hover:text-yellow-500 transition">Partners</a>
        </div>
        <a href="https://discord.gg/YOUR_INVITE_LINK" target="_blank" rel="noopener noreferrer" class="gold-bg text-black px-6 py-2 rounded-sm font-bold hover:bg-yellow-600 transition inline-block">
            JOIN US
        </a>
    </nav>

    <header class="py-20 text-center bg-zinc-900/20">
        <h1 class="text-5xl md:text-6xl gold-text uppercase mb-4">Meet Our Team</h1>
        <div class="h-1 w-24 gold-bg mx-auto mb-6"></div>
        <p class="text-zinc-400 max-w-2xl mx-auto tracking-wide text-sm">North Star Management and Operations Personnel.</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-4xl mx-auto mb-16">
            <div class="staff-card group text-center p-8 bg-zinc-900/40 border border-yellow-900/20 rounded-lg">
                <div class="relative w-40 h-40 mx-auto mb-6">
                    <img src="https://i.pravatar.cc/300?img=33" alt="CEO" class="w-full h-full rounded-full object-cover p-2 border-2 border-yellow-600">
                </div>
                <h3 class="text-2xl mb-1">Alex Miller</h3>
                <p class="gold-text text-sm uppercase tracking-widest font-bold">Chief Executive Officer</p>
            </div>
            <div class="staff-card group text-center p-8 bg-zinc-900/40 border border-yellow-900/20 rounded-lg">
                <div class="relative w-40 h-40 mx-auto mb-6">
                    <img src="https://i.pravatar.cc/300?img=12" alt="COO" class="w-full h-full rounded-full object-cover p-2 border-2 border-yellow-600">
                </div>
                <h3 class="text-2xl mb-1">Sarah Jenkins</h3>
                <p class="gold-text text-sm uppercase tracking-widest font-bold">Operations Director</p>
            </div>
        </div>
    </main>

    <footer class="bg-black border-t border-yellow-900/30 pt-16 pb-8">
        <div class="max-w-7xl mx-auto px-6">
            <div class="pt-8 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center text-zinc-600 text-[10px] uppercase tracking-[0.2em]">
                <div class="flex flex-col md:flex-row md:space-x-4 items-center">
                    <p>&copy; 2026 North Star Transport. All Rights Reserved.</p>
                    <span class="hidden md:inline text-zinc-800">|</span>
                    <p class="gold-text font-bold opacity-80">Version 0.0.1</p>
                </div>
                <p class="mt-2 md:mt-0">Designed for the Virtual Trucking Community</p>
            </div>
        </div>
    </footer>

</body>
</html>
